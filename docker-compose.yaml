services:
  towngas-mcp:
    image: ghcr.io/sdrpsps/towngas-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TOWNGAS_HOST: https://demo.towngasvcc.com
      TOWNGAS_ORG_CODE: xxx
      TOWNGAS_SUBS_CODE: xxx
      TOWNGAS_REFRESH_TOKEN: xxx
      TOWNGAS_ACCESS_TOKEN: xxx
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
