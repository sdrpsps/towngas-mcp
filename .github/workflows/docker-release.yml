name: Build Docker Image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release-tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-tag.outputs.tag_name }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/towngas-mcp" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Sync package version from tag
        run: |
          VERSION="${RELEASE_VERSION}"
          node scripts/set-version.mjs "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          RELEASE_VERSION: ${{ steps.release-tag.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release-tag.outputs.tag_name }}
            type=semver,pattern={{version}},value=${{ steps.release-tag.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release-tag.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ steps.release-tag.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=towngas-mcp
            org.opencontainers.image.description=Towngas stdio MCP server
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
